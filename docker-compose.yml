services:
  db:
    image: postgres:16-alpine
    container_name: laundryconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-laundryconnect}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laundry} -d ${POSTGRES_DB:-laundryconnect}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
